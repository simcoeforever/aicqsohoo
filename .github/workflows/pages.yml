name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # A queued deployment must retain an article committed by weekly.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -m unittest discover tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Worker and browser measurement
        run: node --test worker/tests/*.test.mjs tests/*.test.mjs
      - name: Verify local workerd runtime (no deployment)
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/aicqsohoo-wrangler
          WRANGLER_LOG_PATH: ${{ runner.temp }}/aicqsohoo-wrangler.log
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir .wrangler/dryrun
          node runtime-test.mjs
      - name: Build
        env:
          BASE_URL: https://aicqsohoo.com
          METRICS_ENABLED: ${{ vars.METRICS_ENABLED || 'true' }}
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
