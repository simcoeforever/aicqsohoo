name: Weekly experiment article # English/Japanese use the same validated summary.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/weekly.yml']
  schedule:
    - cron: '17 6 * * 1' # Monday 06:17 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:

# Production activation approved after the disclosure, Free limits and proxy checks.
# Set ENABLE_WEEKLY_REPORTS=false to pause without changing the workflow.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main' && (vars.ENABLE_WEEKLY_REPORTS || 'true') == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate a disclosure-safe closed-week article
        env:
          SUMMARY_URL: ${{ vars.SUMMARY_URL || 'https://aicqsohoo-counter.waste-tkt.workers.dev/summary' }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          SUMMARY_AUTH: ${{ vars.SUMMARY_AUTH || 'public' }}
        run: python weekly_report.py
      - name: Install pinned Worker and payment client dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - name: Build payment browser client
        run: node worker/build-payment-client.mjs
      - name: Test
        run: |
          python -m unittest discover tests
          node --test worker/tests/*.test.mjs tests/*.test.mjs
      - name: Archive public article
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish closed-week experiment summary'
            git push origin HEAD:main
          fi
      - name: Build
        env:
          BASE_URL: https://aicqsohoo.com
          METRICS_ENABLED: ${{ vars.METRICS_ENABLED || 'true' }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GITHUB_TOKEN commits do not trigger pages.yml. Deploy the same tested
      # checkout here; failed pushes stop the run rather than overwriting main.
      - id: deployment
        uses: actions/deploy-pages@v4
